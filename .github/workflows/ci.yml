name: API Security Automation CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t network-api-security .

      - name: Start API container
        run: |
          docker run -d \
            --name network-api-security-api \
            -p 8000:8000 \
            network-api-security

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done

          echo "API failed to start"
          docker logs network-api-security-api
          exit 1

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Pytest
        run: |
          pytest \
            --html=reports/test-report.html \
            --self-contained-html \
            --junitxml=reports/junit-results.xml

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/test-report.html

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: reports/junit-results.xml

      - name: Prepare report for GitHub Pages
        if: always()
        run: |
          mkdir -p public
          cp reports/test-report.html public/index.html

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Show container logs
        if: failure()
        run: docker logs network-api-security-api

  deploy-report:
    if: always()
    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy test report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4